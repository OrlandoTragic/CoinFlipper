<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Coin Flipper - James vs Keira</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --james-yellow: #f59e0b;
      --keira-pink: #ec4899;
      --text-light: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-light);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Layout - Default Single Screen */
    .app-container {
      display: grid;
      grid-template-rows: auto auto 1fr;
      height: 100vh;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      gap: 16px;
      overflow-y: auto;
    }

    /* iPhone Duo Spanning & Foldable Posture Support */
    @media (screen-spanning: single-fold-vertical), (min-width: 700px) and (orientation: landscape) {
      .app-container {
        grid-template-rows: auto 1fr;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        overflow: hidden;
      }

      .header-area {
        grid-column: span 2;
      }

      .stage-panel {
        border-right: 1px solid var(--glass-border);
        padding-right: 16px;
      }
    }

    header {
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Stage Panel */
    .stage-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      perspective: 1000px;
      gap: 20px;
    }

    /* 3D Coin */
    .coin-wrapper {
      width: 200px;
      height: 200px;
      position: relative;
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .coin {
      width: 100%;
      height: 100%;
      position: absolute;
      transform-style: preserve-3d;
      border-radius: 50%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 15px rgba(255,255,255,0.3);
    }

    .coin-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 6px solid rgba(255,255,255,0.4);
    }

    .face-james {
      background: radial-gradient(circle at 30% 30%, #fef08a, #d97706);
      color: #78350f;
    }

    .face-keira {
      background: radial-gradient(circle at 30% 30%, #fbcfe8, #c084fc);
      color: #581c87;
      transform: rotateY(180deg);
    }

    .coin-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-top: 6px;
      text-transform: uppercase;
    }

    .icon-svg {
      width: 65px;
      height: 65px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }

    /* Controls & Dashboard */
    .dashboard-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: center;
    }

    .glass-card {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 14px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      text-align: center;
    }

    .stat-val {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      opacity: 0.7;
      margin-top: 2px;
    }

    /* Win Percentage Bar */
    .ratio-bar-container {
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      margin-top: 8px;
    }

    .ratio-james {
      background: var(--james-yellow);
      width: 50%;
      transition: width 0.3s ease;
    }

    .ratio-keira {
      background: var(--keira-pink);
      width: 50%;
      transition: width 0.3s ease;
    }

    /* History Chips */
    .history-container {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .history-chip {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .chip-james {
      background: rgba(245, 158, 11, 0.2);
      color: var(--james-yellow);
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .chip-keira {
      background: rgba(236, 72, 153, 0.2);
      color: var(--keira-pink);
      border: 1px solid rgba(236, 72, 153, 0.4);
    }

    /* Action Buttons */
    .controls-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .flip-btn {
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
      cursor: pointer;
    }

    .flip-btn:active {
      transform: scale(0.98);
    }

    .icon-btn {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header-area">
      <header>
        <h1>James vs Keira</h1>
      </header>
    </div>

    <!-- Stage Panel -->
    <div class="stage-panel">
      <div class="coin-wrapper" onclick="flipCoin()">
        <div class="coin" id="coin">
          <div class="coin-face face-james">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
            </svg>
            <div class="coin-title">James</div>
          </div>
          <div class="coin-face face-keira">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M20 12c0-3.87-3.13-7-7-7s-7 3.13-7 7c0 2.38 1.19 4.47 3 5.74V21l4-2 4 2v-3.26c1.81-1.27 3-3.36 3-5.74z"/>
            </svg>
            <div class="coin-title">Keira</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Dashboard Panel -->
    <div class="dashboard-panel">
      <!-- Stats Summary -->
      <div class="glass-card">
        <div class="stats-grid">
          <div>
            <div class="stat-val" id="totalFlips">0</div>
            <div class="stat-label">Total</div>
          </div>
          <div>
            <div class="stat-val" id="jamesCount" style="color: var(--james-yellow);">0</div>
            <div class="stat-label">James</div>
          </div>
          <div>
            <div class="stat-val" id="keiraCount" style="color: var(--keira-pink);">0</div>
            <div class="stat-label">Keira</div>
          </div>
          <div>
            <div class="stat-val" id="streakCount">0</div>
            <div class="stat-label">Streak</div>
          </div>
        </div>

        <div class="ratio-bar-container">
          <div class="ratio-james" id="ratioJames"></div>
          <div class="ratio-keira" id="ratioKeira"></div>
        </div>
      </div>

      <!-- History Log -->
      <div class="glass-card">
        <div class="stat-label" style="margin-bottom: 6px;">Recent Flips</div>
        <div class="history-container" id="historyLog">
          <span style="font-size: 0.75rem; opacity: 0.5;">Tap flip to start</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls-row">
        <button class="flip-btn" onclick="flipCoin()">FLIP COIN</button>
        <button class="icon-btn" onclick="resetStats()" title="Reset Stats">↺</button>
      </div>
    </div>
  </div>

  <script>
    let currentRotation = 0;
    let isFlipping = false;
    let total = 0, james = 0, keira = 0, streak = 0, lastWinner = null;
    let history = [];

    // Web Audio Synthesizer for SFX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'flip') {
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'land') {
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    function triggerHaptic() {
      if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
    }

    function flipCoin() {
      if (isFlipping) return;
      isFlipping = true;
      playSound('flip');
      triggerHaptic();

      const coin = document.getElementById('coin');
      const isJames = Math.random() < 0.5;
      const extraSpins = 1800; // 5 full rotations
      const targetRotation = isJames ? 0 : 180;

      currentRotation += extraSpins + (targetRotation - (currentRotation % 360));
      
      coin.style.transition = 'transform 1.8s cubic-bezier(0.15, 0.85, 0.35, 1.2)';
      coin.style.transform = `rotateY(${currentRotation}deg)`;

      setTimeout(() => {
        isFlipping = false;
        playSound('land');
        triggerHaptic();

        // Update stats
        total++;
        if (isJames) {
          james++;
          streak = (lastWinner === 'James') ? streak + 1 : 1;
          lastWinner = 'James';
        } else {
          keira++;
          streak = (lastWinner === 'Keira') ? streak + 1 : 1;
          lastWinner = 'Keira';
        }

        // Particle explosion
        if (window.confetti) {
          confetti({
            particleCount: 40,
            spread: 60,
            origin: { y: 0.6 },
            colors: isJames ? ['#f59e0b', '#fef08a'] : ['#ec4899', '#c084fc']
          });
        }

        // Update UI
        history.unshift(lastWinner);
        if (history.length > 8) history.pop();
        updateUI();
      }, 1800);
    }

    function updateUI() {
      document.getElementById('totalFlips').innerText = total;
      document.getElementById('jamesCount').innerText = james;
      document.getElementById('keiraCount').innerText = keira;
      document.getElementById('streakCount').innerText = streak;

      // Update Ratio Bar
      const jamesPct = total > 0 ? (james / total) * 100 : 50;
      document.getElementById('ratioJames').style.width = `${jamesPct}%`;
      document.getElementById('ratioKeira').style.width = `${100 - jamesPct}%`;

      // Update History Log
      const historyLog = document.getElementById('historyLog');
      historyLog.innerHTML = history.map(w => 
        `<span class="history-chip ${w === 'James' ? 'chip-james' : 'chip-keira'}">${w}</span>`
      ).join('');
    }

    function resetStats() {
      total = 0; james = 0; keira = 0; streak = 0; lastWinner = null; history = [];
      updateUI();
      document.getElementById('historyLog').innerHTML = '<span style="font-size: 0.75rem; opacity: 0.5;">Tap flip to start</span>';
    }
  </script>
</body>
</html>
