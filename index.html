<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flip Decider - James or Keira</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti for winning landings -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700;800&display=swap');

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      background: #0f172a;
      overflow-x: hidden;
    }

    /* iOS Glassmorphism Styles */
    .ios-glass {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .ios-glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* 3D Coin Cylinder Container */
    .coin-container {
      perspective: 1000px;
      width: 220px;
      height: 220px;
      margin: 0 auto;
    }

    .coin {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s linear;
      border-radius: 50%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .coin-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 6px solid rgba(255, 255, 255, 0.4);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
    }

    /* James Side (Lightning / Gold-Electric) */
    .coin-james {
      background: radial-gradient(circle, #facc15 0%, #ca8a04 60%, #854d0e 100%);
      color: #1e1b4b;
      transform: rotateY(0deg);
    }

    .coin-james::before {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, 0.6);
      pointer-events: none;
    }

    /* Keira Side (Unicorn / Pastel Pink-Purple Glow) */
    .coin-keira {
      background: radial-gradient(circle, #f472b6 0%, #c084fc 50%, #6366f1 100%);
      color: #ffffff;
      transform: rotateY(180deg);
    }

    .coin-keira::before {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, 0.6);
      pointer-events: none;
    }

    /* Coin Edge Thickness effect */
    .coin-edge {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transform: translateZ(-2px);
      background: #713f12;
    }

    /* Dynamic Button Animations */
    .ios-btn {
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.2s;
    }
    .ios-btn:active {
      transform: scale(0.95);
    }

    /* Pulsing Glow Effect on Landing */
    @keyframes glow-james {
      0%, 100% { box-shadow: 0 0 25px rgba(250, 204, 21, 0.6); }
      50% { box-shadow: 0 0 50px rgba(250, 204, 21, 0.9); }
    }
    @keyframes glow-keira {
      0%, 100% { box-shadow: 0 0 25px rgba(244, 114, 182, 0.6); }
      50% { box-shadow: 0 0 50px rgba(192, 132, 252, 0.9); }
    }

    .glow-james-active { animation: glow-james 1.5s infinite ease-in-out; }
    .glow-keira-active { animation: glow-keira 1.5s infinite ease-in-out; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-3 sm:p-6">

  <!-- iPhone Mockup Frame Container -->
  <div class="w-full max-w-md h-[92vh] max-h-[850px] ios-glass-card rounded-[48px] shadow-2xl flex flex-col justify-between overflow-hidden relative border border-slate-700/50">
    
    <!-- Top iOS Notch & Status Header -->
    <div class="px-7 pt-4 pb-2 flex justify-between items-center z-20">
      <div class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Flip Decider</div>
      <!-- iOS Notch Indicator -->
      <div class="w-24 h-4 bg-black/60 rounded-full flex items-center justify-center gap-1.5">
        <div class="w-2 h-2 rounded-full bg-slate-700"></div>
        <div class="w-2.5 h-2.5 rounded-full bg-slate-800"></div>
      </div>
      <!-- Controls Toggle -->
      <div class="flex items-center gap-3">
        <button id="soundToggleBtn" onclick="toggleSound()" class="text-slate-300 hover:text-white transition" title="Toggle Sound">
          <i data-lucide="volume-2" class="w-5 h-5" id="soundIcon"></i>
        </button>
        <button id="speedToggleBtn" onclick="toggleSpeed()" class="text-slate-300 hover:text-white text-xs font-bold px-2 py-1 rounded-full bg-white/10" title="Flip Duration Mode">
          NORMAL
        </button>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col items-center justify-between px-6 py-2 z-10 overflow-y-auto">
      
      <!-- Current Streak & Dynamic Banner -->
      <div class="text-center my-1">
        <div id="resultBanner" class="text-2xl font-extrabold tracking-tight min-h-[36px] flex items-center justify-center text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-pink-400">
          Tap Coin or Button to Flip!
        </div>
        <div class="text-xs font-medium text-slate-400 flex items-center justify-center gap-1 mt-0.5">
          <span>Current Streak:</span>
          <span id="streakCount" class="font-bold text-white bg-white/10 px-2 py-0.5 rounded-full text-[11px]">0</span>
        </div>
      </div>

      <!-- 3D Coin Interactive Area -->
      <div class="my-auto py-4 cursor-pointer" onclick="triggerFlip()">
        <div class="coin-container">
          <div id="coin" class="coin">
            <!-- Side A: James -->
            <div class="coin-face coin-james">
              <!-- SVG Yellow Lightning Bolt -->
              <svg class="w-20 h-20 drop-shadow-[0_4px_8px_rgba(0,0,0,0.4)]" viewBox="0 0 24 24" fill="#fef08a" stroke="#854d0e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
              </svg>
              <span class="mt-2 text-2xl font-black tracking-wider uppercase drop-shadow">JAMES</span>
            </div>
            
            <!-- Side B: Keira -->
            <div class="coin-face coin-keira">
              <!-- SVG Unicorn Graphic -->
              <svg class="w-20 h-20 drop-shadow-[0_4px_8px_rgba(0,0,0,0.3)]" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Golden Horn -->
                <path d="M52 25 L68 5 L58 30 Z" fill="#fde047" stroke="#eab308" stroke-width="2" />
                <!-- Ears -->
                <path d="M35 30 Q28 15 42 28 Z" fill="#f472b6" stroke="#fff" stroke-width="1.5"/>
                <path d="M48 32 Q45 18 54 30 Z" fill="#f472b6" stroke="#fff" stroke-width="1.5"/>
                <!-- Head Base -->
                <path d="M30 45 C30 28 60 28 65 42 C70 52 65 65 50 68 C40 70 30 60 30 45 Z" fill="#ffffff"/>
                <!-- Rainbow Mane -->
                <path d="M30 35 Q20 40 25 50 Q18 58 28 65" stroke="#ec4899" stroke-width="5" stroke-linecap="round" fill="none"/>
                <path d="M26 38 Q16 43 21 53 Q14 61 24 68" stroke="#a855f7" stroke-width="4" stroke-linecap="round" fill="none"/>
                <path d="M22 41 Q12 46 17 56" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" fill="none"/>
                <!-- Eye & Lash -->
                <circle cx="52" cy="45" r="3" fill="#1e1b4b"/>
                <path d="M54 42 L57 40" stroke="#1e1b4b" stroke-width="1.5" stroke-linecap="round"/>
                <!-- Cute Blush -->
                <circle cx="58" cy="52" r="4" fill="#f472b6" opacity="0.6"/>
              </svg>
              <span class="mt-2 text-2xl font-black tracking-wider uppercase drop-shadow">KEIRA</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Statistics Dashboard Glass Card -->
      <div class="w-full ios-glass rounded-2xl p-3.5 my-2 text-xs">
        <div class="flex justify-between items-center mb-2 pb-1.5 border-b border-white/10">
          <span class="font-semibold text-slate-300">Statistics</span>
          <span class="text-slate-400">Total Flips: <strong id="totalFlips" class="text-white">0</strong></span>
        </div>
        
        <!-- Comparison Bar -->
        <div class="w-full h-3 bg-slate-800 rounded-full overflow-hidden flex mb-3 p-0.5 border border-white/5">
          <div id="jamesBar" class="bg-gradient-to-r from-yellow-500 to-amber-400 h-full rounded-l-full transition-all duration-500" style="width: 50%"></div>
          <div id="keiraBar" class="bg-gradient-to-r from-pink-400 to-purple-500 h-full rounded-r-full transition-all duration-500" style="width: 50%"></div>
        </div>

        <div class="grid grid-cols-2 gap-2 text-center">
          <!-- James Stats -->
          <div class="bg-yellow-500/10 border border-yellow-500/20 rounded-xl p-2">
            <div class="text-yellow-400 font-bold flex items-center justify-center gap-1">
              <i data-lucide="zap" class="w-3.5 h-3.5"></i> James
            </div>
            <div id="jamesCount" class="text-lg font-extrabold text-white">0</div>
            <div id="jamesPercent" class="text-[10px] text-yellow-300/80 font-medium">0%</div>
          </div>
          <!-- Keira Stats -->
          <div class="bg-pink-500/10 border border-pink-500/20 rounded-xl p-2">
            <div class="text-pink-300 font-bold flex items-center justify-center gap-1">
              <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Keira
            </div>
            <div id="keiraCount" class="text-lg font-extrabold text-white">0</div>
            <div id="keiraPercent" class="text-[10px] text-pink-300/80 font-medium">0%</div>
          </div>
        </div>
      </div>

      <!-- History Log Chips -->
      <div class="w-full my-1">
        <div class="text-[11px] font-semibold text-slate-400 mb-1.5 flex justify-between items-center">
          <span>Recent History</span>
          <button onclick="resetStats()" class="text-[10px] text-slate-500 hover:text-slate-300 transition underline">Reset</button>
        </div>
        <div id="historyLog" class="flex gap-1.5 overflow-x-auto pb-1 min-h-[32px] items-center">
          <span class="text-slate-500 text-[11px] italic">No flips yet</span>
        </div>
      </div>

    </div>

    <!-- Action Bottom Bar -->
    <div class="p-5 bg-black/40 backdrop-blur-md border-t border-white/10 z-20">
      <button id="flipBtn" onclick="triggerFlip()" class="ios-btn w-full py-4 rounded-2xl bg-gradient-to-r from-yellow-400 via-pink-500 to-purple-600 text-white font-extrabold text-lg tracking-wider shadow-lg hover:brightness-110 active:scale-95 flex items-center justify-center gap-2">
        <i data-lucide="refresh-cw" id="btnIcon" class="w-5 h-5"></i>
        <span>FLIP COIN</span>
      </button>
    </div>

  </div>

  <script>
    // App State Management
    let totalFlips = 0;
    let jamesWins = 0;
    let keiraWins = 0;
    let currentStreak = { winner: null, count: 0 };
    let history = [];
    let isFlipping = false;
    let currentRotation = 0;
    let soundEnabled = true;
    let speedFast = false;

    // Web Audio API Context for synthesized sound effects
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Sound FX 1: Coin Flip Spin Noise
    function playFlipSound() {
      if (!soundEnabled) return;
      initAudio();
      
      const duration = speedFast ? 0.6 : 1.2;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + duration);

      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Sound FX 2: Coin Landing Clink / Chime
    function playLandSound(isJames) {
      if (!soundEnabled) return;
      initAudio();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = isJames ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(isJames ? 987.77 : 1318.51, audioCtx.currentTime); // B5 or E6
      osc.frequency.exponentialRampToValueAtTime(isJames ? 493.88 : 659.25, audioCtx.currentTime + 0.3);

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    // Toggle Audio Setting
    function toggleSound() {
      soundEnabled = !soundEnabled;
      const soundIcon = document.getElementById('soundIcon');
      if (soundEnabled) {
        soundIcon.setAttribute('data-lucide', 'volume-2');
      } else {
        soundIcon.setAttribute('data-lucide', 'volume-x');
      }
      lucide.createIcons();
    }

    // Toggle Speed Mode (Normal vs Fast)
    function toggleSpeed() {
      speedFast = !speedFast;
      const speedBtn = document.getElementById('speedToggleBtn');
      speedBtn.innerText = speedFast ? 'FAST' : 'NORMAL';
      speedBtn.classList.toggle('bg-yellow-500/30', speedFast);
    }

    // Core Flip Logic
    function triggerFlip() {
      if (isFlipping) return;
      isFlipping = true;

      initAudio();
      playFlipSound();

      const flipBtn = document.getElementById('flipBtn');
      const btnIcon = document.getElementById('btnIcon');
      const coin = document.getElementById('coin');
      const resultBanner = document.getElementById('resultBanner');

      // Clear previous glow effects
      coin.classList.remove('glow-james-active', 'glow-keira-active');
      
      // Update UI state during flip
      flipBtn.disabled = true;
      flipBtn.classList.add('opacity-75', 'cursor-not-allowed');
      btnIcon.classList.add('animate-spin');
      resultBanner.innerText = "Flipping...";

      // Random outcome (0 = James, 1 = Keira)
      const isJamesWinner = Math.random() < 0.5;
      
      // Calculate 3D Rotation (Multiple 360-degree spins + final side angle)
      const spins = speedFast ? 4 : 8; // Full rotations
      const targetSideAngle = isJamesWinner ? 0 : 180;
      
      // Ensure smooth forward rotation each time
      const currentMod = currentRotation % 360;
      let extraDeg = targetSideAngle - currentMod;
      if (extraDeg <= 0) extraDeg += 360;
      
      currentRotation += (spins * 360) + extraDeg;

      // Apply CSS animation timing
      const duration = speedFast ? 0.7 : 1.5;
      coin.style.transition = `transform ${duration}s cubic-bezier(0.25, 1, 0.5, 1)`;
      coin.style.transform = `rotateY(${currentRotation}deg)`;

      // On Animation End
      setTimeout(() => {
        isFlipping = false;
        flipBtn.disabled = false;
        flipBtn.classList.remove('opacity-75', 'cursor-not-allowed');
        btnIcon.classList.remove('animate-spin');

        // Play Landing SFX
        playLandSound(isJamesWinner);

        // Process Winner
        handleResult(isJamesWinner);
      }, duration * 1000);
    }

    // Handle Win Outcomes, Visual Effects, & Stats
    function handleResult(isJames) {
      const winnerName = isJames ? "James" : "Keira";
      const coin = document.getElementById('coin');
      const resultBanner = document.getElementById('resultBanner');

      // Add Glow Effect to Coin
      coin.classList.add(isJames ? 'glow-james-active' : 'glow-keira-active');

      // Banner Text
      resultBanner.innerText = `It's ${winnerName}!`;
      resultBanner.className = `text-2xl font-extrabold tracking-tight min-h-[36px] flex items-center justify-center ${
        isJames ? 'text-yellow-400 drop-shadow-[0_0_10px_rgba(250,204,21,0.5)]' : 'text-pink-300 drop-shadow-[0_0_10px_rgba(244,114,182,0.5)]'
      }`;

      // Confetti & Particle Explosion
      triggerParticles(isJames);

      // Update Statistics
      totalFlips++;
      if (isJames) {
        jamesWins++;
      } else {
        keiraWins++;
      }

      // Update Streak
      if (currentStreak.winner === winnerName) {
        currentStreak.count++;
      } else {
        currentStreak.winner = winnerName;
        currentStreak.count = 1;
      }

      // Add to History (Max 10)
      history.unshift({ winner: winnerName, isJames });
      if (history.length > 10) history.pop();

      // Render updated UI
      updateStatsUI();
    }

    // Trigger Visual Particle Cannon
    function triggerParticles(isJames) {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: isJames ? 40 : 50,
          spread: 60,
          origin: { y: 0.55 },
          colors: isJames ? ['#facc15', '#eab308', '#ffffff'] : ['#f472b6', '#c084fc', '#6366f1']
        });
      }
    }

    // Render Stats & History UI
    function updateStatsUI() {
      document.getElementById('totalFlips').innerText = totalFlips;
      document.getElementById('jamesCount').innerText = jamesWins;
      document.getElementById('keiraCount').innerText = keiraWins;

      const jamesPct = totalFlips > 0 ? Math.round((jamesWins / totalFlips) * 100) : 0;
      const keiraPct = totalFlips > 0 ? Math.round((keiraWins / totalFlips) * 100) : 0;

      document.getElementById('jamesPercent').innerText = `${jamesPct}%`;
      document.getElementById('keiraPercent').innerText = `${keiraPct}%`;

      document.getElementById('jamesBar').style.width = `${totalFlips > 0 ? jamesPct : 50}%`;
      document.getElementById('keiraBar').style.width = `${totalFlips > 0 ? keiraPct : 50}%`;

      // Streak
      document.getElementById('streakCount').innerText = currentStreak.count > 0 ? `${currentStreak.winner} x${currentStreak.count}` : '0';

      // History Chips
      const historyContainer = document.getElementById('historyLog');
      if (history.length === 0) {
        historyContainer.innerHTML = '<span class="text-slate-500 text-[11px] italic">No flips yet</span>';
        return;
      }

      historyContainer.innerHTML = history.map(item => `
        <span class="px-2 py-1 rounded-lg text-[10px] font-bold shrink-0 border ${
          item.isJames 
            ? 'bg-yellow-500/20 text-yellow-300 border-yellow-500/30' 
            : 'bg-pink-500/20 text-pink-300 border-pink-500/30'
        }">
          ${item.winner}
        </span>
      `).join('');
    }

    // Reset Game Data
    function resetStats() {
      totalFlips = 0;
      jamesWins = 0;
      keiraWins = 0;
      currentStreak = { winner: null, count: 0 };
      history = [];
      
      const coin = document.getElementById('coin');
      coin.classList.remove('glow-james-active', 'glow-keira-active');
      document.getElementById('resultBanner').innerText = "Tap Coin or Button to Flip!";
      document.getElementById('resultBanner').className = "text-2xl font-extrabold tracking-tight min-h-[36px] flex items-center justify-center text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-pink-400";
      
      updateStatsUI();
    }

    // Initialize Lucide Icons on Load
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
