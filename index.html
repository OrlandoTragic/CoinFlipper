<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Coin Flipper - James vs Keira</title>
  
  <!-- Canvas Confetti Library for wins -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    /* Design Tokens & Universal Reset */
    :root {
      --bg-slate: #0f172a;
      --bg-gradient: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 75%);
      --glass-bg: rgba(30, 41, 59, 0.65);
      --glass-border: rgba(255, 255, 255, 0.12);
      --james-gold: #f59e0b;
      --james-accent: #fef08a;
      --keira-pink: #ec4899;
      --keira-purple: #c084fc;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Edge-to-Edge Safari Safe Area Canvas Setup */
    html, body {
      background-color: var(--bg-slate);
      background-image: var(--bg-gradient);
      color: var(--text-main);
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    /* Safe Area Padding Shell */
    .app-viewport {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      padding-top: max(env(safe-area-inset-top), 16px);
      padding-bottom: max(env(safe-area-inset-bottom), 16px);
      padding-left: max(env(safe-area-inset-left), 20px);
      padding-right: max(env(safe-area-inset-right), 20px);
      justify-content: space-between;
    }

    /* Dual Screen & Spanning Adaptation for Duo Devices */
    @media (screen-spanning: single-fold-vertical), (min-width: 768px) and (orientation: landscape) {
      .app-viewport {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto 1fr;
        gap: 24px;
        align-items: center;
      }
      .header-area {
        grid-column: span 2;
      }
      .stage-panel {
        border-right: 1px solid var(--glass-border);
        padding-right: 20px;
        height: 100%;
      }
    }

    /* App Header */
    .header-area {
      text-align: center;
      padding-top: 8px;
    }

    .app-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .app-subtitle {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Central 3D Stage Section */
    .stage-panel {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      perspective: 1200px;
      margin: 12px 0;
    }

    /* Coin Glow & Interactive Target */
    .coin-wrapper {
      width: min(62vw, 240px);
      height: min(62vw, 240px);
      max-width: 250px;
      max-height: 250px;
      position: relative;
      transform-style: preserve-3d;
      cursor: pointer;
      border-radius: 50%;
      transition: transform 0.15s ease-out;
    }

    .coin-wrapper:active {
      transform: scale(0.96);
    }

    .coin {
      width: 100%;
      height: 100%;
      position: absolute;
      transform-style: preserve-3d;
      border-radius: 50%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), 0 0 30px rgba(255, 255, 255, 0.05);
    }

    .coin-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 8px solid rgba(255, 255, 255, 0.35);
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.3);
    }

    /* James Side Styling */
    .face-james {
      background: radial-gradient(circle at 35% 35%, #fde047 0%, #ca8a04 60%, #854d0e 100%);
      color: #422006;
      transform: rotateY(0deg);
    }

    .face-james::before {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, 0.5);
      pointer-events: none;
    }

    /* Keira Side Styling */
    .face-keira {
      background: radial-gradient(circle at 35% 35%, #f472b6 0%, #c084fc 60%, #6366f1 100%);
      color: #ffffff;
      transform: rotateY(180deg);
    }

    .face-keira::before {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, 0.5);
      pointer-events: none;
    }

    .coin-name {
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 900;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    .coin-icon {
      width: 48%;
      height: 48%;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.3));
    }

    /* Dynamic Outcome Banner */
    .status-banner {
      margin-top: 16px;
      font-size: 1.1rem;
      font-weight: 800;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* Dashboard & Glass Cards Panel */
    .dashboard-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 14px 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      text-align: center;
    }

    .stat-number {
      font-size: 1.35rem;
      font-weight: 800;
    }

    .stat-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    /* Win Percentage Distribution Bar */
    .ratio-bar-wrapper {
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      margin-top: 10px;
    }

    .bar-james {
      background: linear-gradient(90deg, #facc15, #f59e0b);
      width: 50%;
      transition: width 0.4s ease;
    }

    .bar-keira {
      background: linear-gradient(90deg, #f472b6, #c084fc);
      width: 50%;
      transition: width 0.4s ease;
    }

    /* History Chips Scroll Area */
    .history-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .history-chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 800;
      white-space: nowrap;
      animation: chipPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes chipPop {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .chip-james {
      background: rgba(245, 158, 11, 0.2);
      color: var(--james-gold);
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .chip-keira {
      background: rgba(236, 72, 153, 0.2);
      color: var(--keira-pink);
      border: 1px solid rgba(236, 72, 153, 0.4);
    }

    /* Action Buttons Row */
    .action-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
    }

    .btn-flip {
      padding: 16px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow: 0 12px 25px -5px rgba(99, 102, 241, 0.5);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .btn-flip:active {
      transform: scale(0.97);
    }

    .btn-icon {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: transform 0.1s ease;
    }

    .btn-icon:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <!-- Top Bar Title -->
    <div class="header-area">
      <div class="app-title">Flip Decider</div>
      <div class="app-subtitle">James or Keira</div>
    </div>

    <!-- Center 3D Stage Section -->
    <div class="stage-panel">
      <div class="coin-wrapper" onclick="flipCoin()">
        <div class="coin" id="coin">
          
          <!-- Side A: James -->
          <div class="coin-face face-james">
            <svg class="coin-icon" viewBox="0 0 24 24" fill="#fef08a" stroke="#854d0e" stroke-width="1.5">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            <div class="coin-name">JAMES</div>
          </div>

          <!-- Side B: Keira -->
          <div class="coin-face face-keira">
            <svg class="coin-icon" viewBox="0 0 100 100" fill="none">
              <path d="M52 25 L68 5 L58 30 Z" fill="#fde047" stroke="#eab308" stroke-width="2" />
              <path d="M35 30 Q28 15 42 28 Z" fill="#f472b6" stroke="#fff" stroke-width="1.5"/>
              <path d="M48 32 Q45 18 54 30 Z" fill="#f472b6" stroke="#fff" stroke-width="1.5"/>
              <path d="M30 45 C30 28 60 28 65 42 C70 52 65 65 50 68 C40 70 30 60 30 45 Z" fill="#ffffff"/>
              <path d="M30 35 Q20 40 25 50 Q18 58 28 65" stroke="#ec4899" stroke-width="5" stroke-linecap="round"/>
              <path d="M26 38 Q16 43 21 53 Q14 61 24 68" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
              <path d="M22 41 Q12 46 17 56" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
              <circle cx="52" cy="45" r="3" fill="#1e1b4b"/>
              <circle cx="58" cy="52" r="4" fill="#f472b6" opacity="0.6"/>
            </svg>
            <div class="coin-name">KEIRA</div>
          </div>

        </div>
      </div>

      <!-- Live Result Banner -->
      <div id="statusBanner" class="status-banner" style="color: var(--text-muted);">
        Tap Coin or Button to Flip
      </div>
    </div>

    <!-- Lower Dashboard Panel -->
    <div class="dashboard-panel">
      
      <!-- Stats Summary Card -->
      <div class="glass-card">
        <div class="stats-grid">
          <div>
            <div class="stat-number" id="totalFlips">0</div>
            <div class="stat-label">Total</div>
          </div>
          <div>
            <div class="stat-number" id="jamesCount" style="color: var(--james-gold);">0</div>
            <div class="stat-label">James</div>
          </div>
          <div>
            <div class="stat-number" id="keiraCount" style="color: var(--keira-pink);">0</div>
            <div class="stat-label">Keira</div>
          </div>
          <div>
            <div class="stat-number" id="streakCount">0</div>
            <div class="stat-label">Streak</div>
          </div>
        </div>

        <div class="ratio-bar-wrapper">
          <div class="bar-james" id="barJames"></div>
          <div class="bar-keira" id="barKeira"></div>
        </div>
      </div>

      <!-- History Card -->
      <div class="glass-card history-card">
        <div class="history-header">
          <span class="stat-label">Recent History</span>
          <span class="stat-label" id="winRateText">50% / 50%</span>
        </div>
        <div class="history-chips" id="historyChips">
          <span style="font-size: 0.75rem; color: var(--text-muted);">No flips recorded</span>
        </div>
      </div>

      <!-- Button Controls -->
      <div class="action-row">
        <button class="btn-flip" id="flipBtn" onclick="flipCoin()">FLIP COIN</button>
        <button class="btn-icon" onclick="resetStats()" title="Reset All Stats">↺</button>
      </div>

    </div>

  </div>

  <script>
    // State Tracker
    let currentRotation = 0;
    let isFlipping = false;
    let total = 0, james = 0, keira = 0, streak = 0, lastWinner = null;
    let history = [];

    // Synthesized Audio Context
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type, isJames = false) {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'flip') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(750, audioCtx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.18);
      } else if (type === 'land') {
        osc.type = isJames ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(isJames ? 987.77 : 1318.51, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(isJames ? 493.88 : 659.25, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    function triggerHaptic() {
      if (navigator.vibrate) {
        navigator.vibrate([25, 40, 25]);
      }
    }

    function flipCoin() {
      if (isFlipping) return;
      isFlipping = true;

      initAudio();
      playSound('flip');
      triggerHaptic();

      const coin = document.getElementById('coin');
      const statusBanner = document.getElementById('statusBanner');
      const flipBtn = document.getElementById('flipBtn');

      flipBtn.style.opacity = '0.7';
      statusBanner.innerText = "Flipping...";
      statusBanner.style.color = "var(--text-muted)";

      // Random winner selection
      const isJames = Math.random() < 0.5;
      const spins = 1800; // 5 full rotations
      const targetSide = isJames ? 0 : 180;

      currentRotation += spins + (targetSide - (currentRotation % 360));
      
      coin.style.transition = 'transform 1.6s cubic-bezier(0.15, 0.85, 0.35, 1.15)';
      coin.style.transform = `rotateY(${currentRotation}deg)`;

      setTimeout(() => {
        isFlipping = false;
        flipBtn.style.opacity = '1';

        playSound('land', isJames);
        triggerHaptic();

        // Register Winner
        const winnerName = isJames ? "James" : "Keira";
        statusBanner.innerText = `It's ${winnerName}!`;
        statusBanner.style.color = isJames ? "var(--james-gold)" : "var(--keira-pink)";

        total++;
        if (isJames) {
          james++;
          streak = (lastWinner === 'James') ? streak + 1 : 1;
          lastWinner = 'James';
        } else {
          keira++;
          streak = (lastWinner === 'Keira') ? streak + 1 : 1;
          lastWinner = 'Keira';
        }

        // Trigger Confetti
        if (window.confetti) {
          confetti({
            particleCount: 45,
            spread: 60,
            origin: { y: 0.55 },
            colors: isJames ? ['#facc15', '#f59e0b', '#ffffff'] : ['#f472b6', '#c084fc', '#6366f1']
          });
        }

        history.unshift({ name: winnerName, isJames });
        if (history.length > 8) history.pop();

        updateUI();
      }, 1600);
    }

    function updateUI() {
      document.getElementById('totalFlips').innerText = total;
      document.getElementById('jamesCount').innerText = james;
      document.getElementById('keiraCount').innerText = keira;
      document.getElementById('streakCount').innerText = streak > 0 ? `${streak}` : '0';

      const jamesPct = total > 0 ? Math.round((james / total) * 100) : 50;
      const keiraPct = total > 0 ? Math.round((keira / total) * 100) : 50;

      document.getElementById('barJames').style.width = `${jamesPct}%`;
      document.getElementById('barKeira').style.width = `${keiraPct}%`;
      document.getElementById('winRateText').innerText = `${jamesPct}% / ${keiraPct}%`;

      const historyChips = document.getElementById('historyChips');
      if (history.length === 0) {
        historyChips.innerHTML = '<span style="font-size: 0.75rem; color: var(--text-muted);">No flips recorded</span>';
      } else {
        historyChips.innerHTML = history.map(item => `
          <span class="chip ${item.isJames ? 'chip-james' : 'chip-keira'}">
            ${item.name}
          </span>
        `).join('');
      }
    }

    function resetStats() {
      total = 0; james = 0; keira = 0; streak = 0; lastWinner = null; history = [];
      const statusBanner = document.getElementById('statusBanner');
      statusBanner.innerText = "Tap Coin or Button to Flip";
      statusBanner.style.color = "var(--text-muted)";
      updateUI();
    }
  </script>
</body>
</html>
