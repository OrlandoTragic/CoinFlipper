<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Coin Flipper - James vs Keira</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --james-yellow: #f59e0b;
      --keira-pink: #ec4899;
      --text-light: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-light);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Main Container - Single Screen Default */
    .app-container {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      gap: 16px;
    }

    /* iPhone Duo Dual-Screen / Spanning Support */
    @media (screen-spanning: single-fold-vertical), (min-width: 700px) and (orientation: landscape) {
      .app-container {
        grid-template-rows: 1fr;
        grid-template-columns: 1fr 1fr;
        gap: 32px;
      }

      .stage-panel {
        border-right: 1px solid var(--glass-border);
        padding-right: 16px;
      }
    }

    @media (screen-spanning: single-fold-horizontal) {
      .app-container {
        grid-template-rows: 1fr 1fr;
        grid-template-columns: 1fr;
        gap: 32px;
      }
    }

    /* Header */
    header {
      text-align: center;
      padding: 8px 0;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Stage Panel (Coin Display) */
    .stage-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      perspective: 1000px;
    }

    /* 3D Coin */
    .coin-wrapper {
      width: 220px;
      height: 220px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
      cursor: pointer;
    }

    .coin {
      width: 100%;
      height: 100%;
      position: absolute;
      transform-style: preserve-3d;
      border-radius: 50%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 15px rgba(255,255,255,0.3);
    }

    .coin-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 6px solid rgba(255,255,255,0.4);
    }

    /* James Side */
    .face-james {
      background: radial-gradient(circle at 30% 30%, #fef08a, #d97706);
      color: #78350f;
    }

    /* Keira Side */
    .face-keira {
      background: radial-gradient(circle at 30% 30%, #fbcfe8, #c084fc);
      color: #581c87;
      transform: rotateY(180deg);
    }

    .coin-title {
      font-size: 2rem;
      font-weight: 800;
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.15);
    }

    .icon-svg {
      width: 70px;
      height: 70px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }

    /* Dashboard & Stats Panel */
    .dashboard-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
    }

    .glass-card {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 16px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      text-align: center;
    }

    .stat-val {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      opacity: 0.7;
      margin-top: 2px;
    }

    /* Action Button */
    .flip-btn {
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .flip-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Panel 1: Stage & Coin (Left screen in Duo Book Mode) -->
    <div class="stage-panel">
      <header>
        <h1>James vs Keira</h1>
      </header>

      <div class="coin-wrapper" id="coinWrapper" onclick="flipCoin()">
        <div class="coin" id="coin">
          <!-- James Side -->
          <div class="coin-face face-james">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
            </svg>
            <div class="coin-title">James</div>
          </div>
          <!-- Keira Side -->
          <div class="coin-face face-keira">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M20 12c0-3.87-3.13-7-7-7s-7 3.13-7 7c0 2.38 1.19 4.47 3 5.74V21l4-2 4 2v-3.26c1.81-1.27 3-3.36 3-5.74z"/>
            </svg>
            <div class="coin-title">Keira</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Panel 2: Controls & Stats (Right screen in Duo Book Mode) -->
    <div class="dashboard-panel">
      <div class="glass-card stats-grid">
        <div>
          <div class="stat-val" id="jamesCount" style="color: var(--james-yellow);">0</div>
          <div class="stat-label">James</div>
        </div>
        <div>
          <div class="stat-val" id="keiraCount" style="color: var(--keira-pink);">0</div>
          <div class="stat-label">Keira</div>
        </div>
      </div>

      <button class="flip-btn" onclick="flipCoin()">FLIP COIN</button>
    </div>
  </div>

  <script>
    let currentRotation = 0;
    let isFlipping = false;
    let jamesWins = 0;
    let keiraWins = 0;

    function triggerHaptic() {
      if (navigator.vibrate) {
        navigator.vibrate([30, 50, 30]);
      }
    }

    function flipCoin() {
      if (isFlipping) return;
      isFlipping = true;
      triggerHaptic();

      const coin = document.getElementById('coin');
      const isJames = Math.random() < 0.5;
      
      // Calculate 3D rotations (minimum 5 full spins = 1800 deg)
      const extraSpins = 1800;
      const targetRotation = isJames ? 0 : 180;
      
      currentRotation += extraSpins + (targetRotation - (currentRotation % 360));
      
      coin.style.transition = 'transform 2s cubic-bezier(0.15, 0.85, 0.35, 1.2)';
      coin.style.transform = `rotateY(${currentRotation}deg)`;

      setTimeout(() => {
        isFlipping = false;
        if (isJames) {
          jamesWins++;
          document.getElementById('jamesCount').innerText = jamesWins;
        } else {
          keiraWins++;
          document.getElementById('keiraCount').innerText = keiraWins;
        }
        triggerHaptic();
      }, 2000);
    }
  </script>
</body>
</html>
